seed: ${eval:${oc.env:SEED,42}}

trainer:
  _target_: lightning.Trainer
  max_epochs: ${eval:${oc.env:DINO_PROBE_EPOCHS,-1}}
  max_steps: ${eval:${oc.env:DINO_PROBE_MAX_STEPS,12500}}
  check_val_every_n_epoch: null
  val_check_interval: ${eval:${oc.env:DINO_PROBE_VAL_CHECK_INTERVAL,1250}}
  accelerator: ${oc.env:ACCELERATOR,gpu}
  devices: ${eval:${oc.env:DEVICES,1}}
  strategy: ${oc.env:PROBE_STRATEGY,auto}
  precision: ${oc.env:PRECISION,16-mixed}
  num_sanity_val_steps: 0
  sync_batchnorm: ${eval:${oc.env:SYNC_BATCHNORM,0}}
  default_root_dir: ${oc.env:DINO_PROBE_OUTPUT_DIR,benchmarks/imagenet10/runs/lejepa-probe-dino-style}
  callbacks:
    - _target_: stable_pretraining.callbacks.DinoStyleLinearProbe
      _partial_: true
      name: linear_probe_dinov3_style
      target: label
      num_classes: ${eval:${oc.env:NUM_CLASSES,10}}
      embed_dim: ${eval:${oc.env:EMBED_DIM,384}}
      learning_rates: ${oc.decode:${oc.env:DINO_PROBE_LRS,[1e-5,2e-5,5e-5,1e-4,2e-4,5e-4,1e-3,2e-3,5e-3,1e-2,2e-2,5e-2,0.1]}}
      n_last_blocks: ${oc.decode:${oc.env:DINO_PROBE_N_LAST_BLOCKS,[1,2,4]}}
      pools: ${oc.decode:${oc.env:DINO_PROBE_POOLS,[cls,avgpool]}}
      batch_size: ${eval:${oc.env:PROBE_BATCH_SIZE,128}}
      lr_scale_base: ${eval:${oc.env:DINO_PROBE_LR_SCALE_BASE,256}}
      optimizers: ${oc.decode:${oc.env:DINO_PROBE_OPTIMIZERS,[sgd,adamw]}}
      momentum: ${eval:${oc.env:DINO_PROBE_MOMENTUM,0.9}}
      weight_decay: ${eval:${oc.env:DINO_PROBE_WEIGHT_DECAY,0.0}}
      adamw_weight_decay: ${eval:${oc.env:DINO_PROBE_ADAMW_WEIGHT_DECAY,0.0}}
      eval_dataset_name: ${oc.env:EVAL_DATASET_NAME,imagenet10}
      in_domain_dataset_name: ${oc.env:IN_DOMAIN_DATASET_NAME,${oc.env:DATASET_CACHE_NAME,imagenet10}}
  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${oc.env:DINO_PROBE_OUTPUT_DIR,benchmarks/imagenet10/runs/lejepa-probe-dino-style}/logs
    name: linear_probe_dinov3_style

module:
  _target_: stable_pretraining.Module
  forward: stable_pretraining.forward.frozen_backbone_probe_labels
  backbone:
    _target_: stable_pretraining.backbone.from_timm_checkpoint
    model_name: ${oc.env:ENCODER_NAME,vit_small_patch16_224}
    checkpoint_path: ${oc.env:BACKBONE_CKPT}
    pretrained: false
    num_classes: 0
    dynamic_img_size: ${eval:'"${oc.env:BACKBONE_DYNAMIC_IMG_SIZE,false}".lower() in ("1", "true", "yes", "on")'}
    drop_path_rate: 0.0
  optim: null

data:
  _target_: stable_pretraining.data.DataModule
  train:
    batch_size: ${eval:${oc.env:PROBE_BATCH_SIZE,128}}
    num_workers: ${eval:${oc.env:NUM_WORKERS,8}}
    prefetch_factor: ${eval:${oc.env:PREFETCH_FACTOR,4}}
    drop_last: false
    shuffle: true
    dataset:
      _target_: ${eval:'"stable_pretraining.data.images.LanceImageDataset" if "${oc.env:DATASET_BACKEND,hf}" == "lance" else "stable_pretraining.data.HFDataset"'}
      _args_:
        - ${oc.env:DATASET_PATH,frgfm/imagenette}
      split: ${oc.env:TRAIN_SPLIT,train}
      revision: ${oc.decode:${oc.env:DATASET_REVISION,null}}
      cache_dir: ${oc.env:STABLE_PRETRAINING_DATA_DIR,/tmp/stable-pretraining-data}/${oc.env:DATASET_CACHE_NAME,imagenet10}
      rename_columns: ${oc.decode:${oc.env:RENAME_COLUMNS,null}}
      remove_columns: ${oc.decode:${oc.env:REMOVE_COLUMNS,null}}
      transform: ${train_transform}
  val:
    batch_size: ${eval:${oc.env:VAL_BATCH_SIZE,128}}
    num_workers: ${eval:${oc.env:NUM_WORKERS,8}}
    prefetch_factor: ${eval:${oc.env:PREFETCH_FACTOR,4}}
    dataset:
      _target_: ${eval:'"stable_pretraining.data.images.LanceImageDataset" if "${oc.env:DATASET_BACKEND,hf}" == "lance" else "stable_pretraining.data.HFDataset"'}
      _args_:
        - ${oc.env:DATASET_PATH,frgfm/imagenette}
      split: ${oc.env:VAL_SPLIT,validation}
      revision: ${oc.decode:${oc.env:DATASET_REVISION,null}}
      cache_dir: ${oc.env:STABLE_PRETRAINING_DATA_DIR,/tmp/stable-pretraining-data}/${oc.env:DATASET_CACHE_NAME,imagenet10}
      rename_columns: ${oc.decode:${oc.env:RENAME_COLUMNS,null}}
      remove_columns: ${oc.decode:${oc.env:REMOVE_COLUMNS,null}}
      transform: ${eval_transform}

train_transform:
  _target_: stable_pretraining.data.transforms.Compose
  _args_:
    - _target_: stable_pretraining.data.transforms.RGB
    - _target_: stable_pretraining.data.transforms.RandomResizedCrop
      size: [224, 224]
      scale:
        - ${eval:${oc.env:DINO_PROBE_RRC_SCALE_MIN,0.08}}
        - ${eval:${oc.env:DINO_PROBE_RRC_SCALE_MAX,1.0}}
    - _target_: stable_pretraining.data.transforms.RandomHorizontalFlip
    - _target_: stable_pretraining.data.transforms.ToImage
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

eval_transform:
  _target_: stable_pretraining.data.transforms.Compose
  _args_:
    - _target_: stable_pretraining.data.transforms.RGB
    - _target_: stable_pretraining.data.transforms.Resize
      size: [256, 256]
    - _target_: stable_pretraining.data.transforms.CenterCrop
      size: [224, 224]
    - _target_: stable_pretraining.data.transforms.ToImage
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

hydra:
  job:
    chdir: false
