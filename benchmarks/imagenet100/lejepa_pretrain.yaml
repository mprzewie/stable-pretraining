seed: ${eval:${oc.env:SEED,42}}
weights_only: true

trainer:
  _target_: lightning.Trainer
  max_epochs: ${eval:${oc.env:EPOCHS,20}}
  accelerator: ${oc.env:ACCELERATOR,gpu}
  devices: ${eval:${oc.env:DEVICES,1}}
  strategy: ${oc.env:STRATEGY,auto}
  precision: ${oc.env:PRECISION,16-mixed}
  num_sanity_val_steps: 0
  sync_batchnorm: ${eval:${oc.env:SYNC_BATCHNORM,0}}
  accumulate_grad_batches: ${eval:${oc.env:ACCUMULATE_GRAD_BATCHES,1}}
  default_root_dir: ${oc.env:OUTPUT_DIR,benchmarks/imagenet10/runs/lejepa}
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      filename: lejepa-{epoch:03d}
      every_n_epochs: ${eval:${oc.env:SAVE_EVERY_N_EPOCHS,20}}
      save_top_k: -1
      save_last: true
    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: step
    - _target_: stable_pretraining.callbacks.OnlineProbe
      _partial_: true
      name: linear_probe
      input: embedding
      target: label
      probe:
        _target_: torch.nn.Linear
        in_features: ${eval:${oc.env:EMBED_DIM,384}}
        out_features: ${eval:${oc.env:NUM_CLASSES,10}}
      loss:
        _target_: torch.nn.CrossEntropyLoss
      metrics:
        top1:
          _target_: torchmetrics.classification.MulticlassAccuracy
          num_classes: ${eval:${oc.env:NUM_CLASSES,10}}
        top5:
          _target_: torchmetrics.classification.MulticlassAccuracy
          num_classes: ${eval:${oc.env:NUM_CLASSES,10}}
          top_k: 5
      optimizer:
        type: AdamW
        lr: ${eval:${oc.env:ONLINE_PROBE_LR,0.03}}
        weight_decay: ${eval:${oc.env:ONLINE_PROBE_WEIGHT_DECAY,1e-6}}
    - _target_: stable_pretraining.callbacks.OnlineKNN
      name: knn_probe
      input: embedding
      target: label
      queue_length: ${eval:${oc.env:KNN_QUEUE_LENGTH,10000}}
      metrics:
        top1:
          _target_: torchmetrics.classification.MulticlassAccuracy
          num_classes: ${eval:${oc.env:NUM_CLASSES,10}}
      input_dim: ${eval:${oc.env:EMBED_DIM,384}}
      k: ${eval:${oc.env:KNN_K,20}}
  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${oc.env:OUTPUT_DIR,benchmarks/imagenet10/runs/lejepa}/logs
    name: pretrain

module:
  _target_: stable_pretraining.Module
  forward: stable_pretraining.forward.lejepa
  model:
    _target_: stable_pretraining.methods.LeJEPA
    encoder_name: ${oc.env:ENCODER_NAME,vit_small_patch16_224}
    pretrained: ${eval:${oc.env:PRETRAINED_BACKBONE,0}}
    drop_path_rate: ${eval:${oc.env:DROP_PATH_RATE,0.1}}
    sigreg: ${oc.env:SIGREG,ep}
    override_sr_gamma: ${oc.decode:${oc.env:OVERRIDE_SR_GAMMA,null}}
    lamb: ${eval:${oc.env:LAMB,0.02}}
    n_slices: ${eval:${oc.env:N_SLICES,1024}}
    n_points: ${eval:${oc.env:N_POINTS,17}}
    t_max: ${eval:${oc.env:T_MAX,3.0}}
  optim:
    optimizer:
      type: AdamW
      lr: ${eval:${oc.env:LR,4e-4}}
      weight_decay: ${eval:${oc.env:WEIGHT_DECAY,0.05}}
      betas:
        - ${eval:${oc.env:ADAM_BETA1,0.9}}
        - ${eval:${oc.env:ADAM_BETA2,0.999}}
    scheduler:
      type: LinearWarmupCosineAnnealing
      total_steps: ${eval:${oc.env:TOTAL_STEPS,1460}}
      peak_step: ${eval:${oc.env:WARMUP_FRACTION,0.1}}
      start_factor: ${eval:${oc.env:START_FACTOR,0.01}}
      end_lr: ${eval:${oc.env:END_LR,4e-6}}
    interval: step

data:
  _target_: stable_pretraining.data.DataModule
  train:
    batch_size: ${eval:${oc.env:BATCH_SIZE,128}}
    num_workers: ${eval:${oc.env:NUM_WORKERS,8}}
    prefetch_factor: ${eval:${oc.env:PREFETCH_FACTOR,4}}
    drop_last: true
    shuffle: true
    dataset:
      _target_: ${eval:'"stable_pretraining.data.images.LanceImageDataset" if "${oc.env:DATASET_BACKEND,hf}" == "lance" else "stable_pretraining.data.HFDataset"'}
      _args_:
        - ${oc.env:DATASET_PATH,frgfm/imagenette}
      split: ${oc.env:TRAIN_SPLIT,train}
      revision: ${oc.decode:${oc.env:DATASET_REVISION,null}}
      cache_dir: ${oc.env:STABLE_PRETRAINING_DATA_DIR,/tmp/stable-pretraining-data}/${oc.env:DATASET_CACHE_NAME,imagenet10}
      transform: ${train_cpu_transform}
      gpu_transform: ${lejepa_gpu_transform}
  val:
    batch_size: ${eval:${oc.env:VAL_BATCH_SIZE,128}}
    num_workers: ${eval:${oc.env:NUM_WORKERS,8}}
    prefetch_factor: ${eval:${oc.env:PREFETCH_FACTOR,4}}
    dataset:
      _target_: ${eval:'"stable_pretraining.data.images.LanceImageDataset" if "${oc.env:DATASET_BACKEND,hf}" == "lance" else "stable_pretraining.data.HFDataset"'}
      _args_:
        - ${oc.env:DATASET_PATH,frgfm/imagenette}
      split: ${oc.env:VAL_SPLIT,validation}
      revision: ${oc.decode:${oc.env:DATASET_REVISION,null}}
      cache_dir: ${oc.env:STABLE_PRETRAINING_DATA_DIR,/tmp/stable-pretraining-data}/${oc.env:DATASET_CACHE_NAME,imagenet10}
      transform: ${eval_transform}

global_transform:
  _target_: stable_pretraining.data.transforms.Compose
  _args_:
    - _target_: stable_pretraining.data.transforms.RGB
    - _target_: stable_pretraining.data.transforms.RandomResizedCrop
      size: [224, 224]
      scale: [0.3, 1.0]
    - _target_: stable_pretraining.data.transforms.RandomHorizontalFlip
      p: 0.5
    - _target_: stable_pretraining.data.transforms.ColorJitter
      brightness: 0.4
      contrast: 0.4
      saturation: 0.2
      hue: 0.1
      p: 0.8
    - _target_: stable_pretraining.data.transforms.RandomGrayscale
      p: 0.2
    - _target_: stable_pretraining.data.transforms.GaussianBlur
      kernel_size: 23
      sigma: [0.1, 2.0]
      p: 0.5
    - _target_: stable_pretraining.data.transforms.RandomSolarize
      threshold: 128
      p: 0.2
    - _target_: stable_pretraining.data.transforms.ToImage
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

local_transform:
  _target_: stable_pretraining.data.transforms.Compose
  _args_:
    - _target_: stable_pretraining.data.transforms.RGB
    - _target_: stable_pretraining.data.transforms.RandomResizedCrop
      size: [96, 96]
      scale: [0.05, 0.3]
    - _target_: stable_pretraining.data.transforms.RandomHorizontalFlip
      p: 0.5
    - _target_: stable_pretraining.data.transforms.ColorJitter
      brightness: 0.4
      contrast: 0.4
      saturation: 0.2
      hue: 0.1
      p: 0.8
    - _target_: stable_pretraining.data.transforms.RandomGrayscale
      p: 0.2
    - _target_: stable_pretraining.data.transforms.GaussianBlur
      kernel_size: 23
      sigma: [0.1, 2.0]
      p: 0.5
    - _target_: stable_pretraining.data.transforms.RandomSolarize
      threshold: 128
      p: 0.2
    - _target_: stable_pretraining.data.transforms.ToImage
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

eval_transform:
  _target_: stable_pretraining.data.transforms.Compose
  _args_:
    - _target_: stable_pretraining.data.transforms.RGB
    - _target_: stable_pretraining.data.transforms.Resize
      size: [256, 256]
    - _target_: stable_pretraining.data.transforms.CenterCrop
      size: [224, 224]
    - _target_: stable_pretraining.data.transforms.ToImage
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

train_cpu_transform:
  _target_: stable_pretraining.data.transforms.Compose
  _args_:
    - _target_: stable_pretraining.data.transforms.RGB
    - _target_: stable_pretraining.data.transforms.Resize
      size: [256, 256]
    - _target_: stable_pretraining.data.transforms.ToImage

lejepa_gpu_transform:
  _target_: stable_pretraining.data.gpu_transforms.MultiView
  chains:
    global_1: ${global_gpu_transform}
    global_2: ${global_gpu_transform}
    local_1: ${local_gpu_transform}
    local_2: ${local_gpu_transform}
    local_3: ${local_gpu_transform}
    local_4: ${local_gpu_transform}
    local_5: ${local_gpu_transform}
    local_6: ${local_gpu_transform}

global_gpu_transform:
  _target_: stable_pretraining.data.gpu_transforms.GPUCompose
  compile: ${eval:${oc.env:GPU_AUG_COMPILE,0}}
  transforms:
    - _target_: stable_pretraining.data.gpu_transforms.GPURandomResizedCrop
      size: 224
      scale: [0.3, 1.0]
    - _target_: stable_pretraining.data.gpu_transforms.GPURandomHorizontalFlip
      p: 0.5
    - _target_: stable_pretraining.data.gpu_transforms.GPUColorJitter
      brightness: 0.4
      contrast: 0.4
      saturation: 0.2
      hue: 0.1
      p: 0.8
    - _target_: stable_pretraining.data.gpu_transforms.GPURandomGrayscale
      p: 0.2
    - _target_: stable_pretraining.data.gpu_transforms.GPUGaussianBlur
      kernel_size: 23
      sigma: [0.1, 2.0]
      p: 0.5
    - _target_: stable_pretraining.data.gpu_transforms.GPURandomSolarize
      thresholds: 0.5
      additions: 0.0
      p: 0.2
    - _target_: stable_pretraining.data.gpu_transforms.GPUNormalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

local_gpu_transform:
  _target_: stable_pretraining.data.gpu_transforms.GPUCompose
  compile: ${eval:${oc.env:GPU_AUG_COMPILE,0}}
  transforms:
    - _target_: stable_pretraining.data.gpu_transforms.GPURandomResizedCrop
      size: 96
      scale: [0.05, 0.3]
    - _target_: stable_pretraining.data.gpu_transforms.GPURandomHorizontalFlip
      p: 0.5
    - _target_: stable_pretraining.data.gpu_transforms.GPUColorJitter
      brightness: 0.4
      contrast: 0.4
      saturation: 0.2
      hue: 0.1
      p: 0.8
    - _target_: stable_pretraining.data.gpu_transforms.GPURandomGrayscale
      p: 0.2
    - _target_: stable_pretraining.data.gpu_transforms.GPUGaussianBlur
      kernel_size: 23
      sigma: [0.1, 2.0]
      p: 0.5
    - _target_: stable_pretraining.data.gpu_transforms.GPURandomSolarize
      thresholds: 0.5
      additions: 0.0
      p: 0.2
    - _target_: stable_pretraining.data.gpu_transforms.GPUNormalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

hydra:
  job:
    chdir: false
